[package]
name = "coducktor-tui"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "coducktor"
path = "src/main.rs"

# Same binary, short name (spec §2.2.1 decision 6: `duck` is the one short token
# used everywhere — command, env prefix, marker prefix, branch prefix — rather than
# a second competing abbreviation). `cargo install` lands both on PATH from one build.
[[bin]]
name = "duck"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
coducktor-client = { path = "../coducktor-client" }
coducktor-contract = { path = "../coducktor-contract" }
coducktor-core = { path = "../coducktor-core" }
coducktor-protocol = { path = "../coducktor-protocol" }
coducktor-runners = { path = "../coducktor-runners" }
coducktor-server = { path = "../coducktor-server" }
crossterm.workspace = true
futures-util.workspace = true
image.workspace = true
notify-rust.workspace = true
nucleo.workspace = true
open.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
syntect.workspace = true
tokio.workspace = true
toml.workspace = true
tui-markdown.workspace = true
two-face.workspace = true

[dev-dependencies]
criterion.workspace = true
insta = "1.46"
tempfile = "3.23"

[[bench]]
name = "transcript"
harness = false
