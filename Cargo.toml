[workspace]
members = [
    "crates/coducktor-client",
    "crates/coducktor-contract",
    "crates/coducktor-protocol",
    "crates/coducktor-tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/blakepiper/coducktor"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
crossterm = "0.28.1"
ratatui = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
bytes = "1.0"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
toml = "0.8"
url = "2.5"
