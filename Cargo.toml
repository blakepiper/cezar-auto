[workspace]
members = [
    "crates/coducktor-client",
    "crates/coducktor-contract",
    "crates/coducktor-core",
    "crates/coducktor-forge",
    "crates/coducktor-protocol",
    "crates/coducktor-runners",
    "crates/coducktor-tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/blakepiper/coducktor"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
criterion = "0.8"
crossterm = "0.28.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Real SIGTERM on Unix child processes — std::process::Child::kill only sends SIGKILL.
libc = "0.2"
# `unstable-rendered-line-info` powers `Paragraph::line_count`, the transcript's only way to
# Measure a markdown block's wrapped height without rendering it.
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm", "image-defaults"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Syntax highlighting for the diff widget; `two-face` bundles `bat`'s syntax +
# theme assets rather than shipping only syntect's tiny default set.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = "0.5"
# Word-level intra-line diff for changed lines.
similar = "3.1"
tui-markdown = "=0.3.6"
# Fuzzy matching for the command palette.
nucleo = "0.5"
# Desktop notifications for task state changes.
notify-rust = "4"
# Open URLs in the OS default handler for external GitHub links.
open = "5"
# Embedded per-project terminals: the PTY seam (WezTerm's own library) and the
# pure-Rust escape-sequence parser that turns the shell stream into a cell grid.
portable-pty = "0.9"
vt100 = "0.15"
# CLI argument parsing for the TUI binary.
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
toml = "0.8"
regex = "1"
# Workflow YAML. Maintained fork of `serde_yaml`.
serde_yaml_ng = "0.10"
sha2 = "0.10"
