name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check TUI screen transport boundary
        run: |
          if [ -d crates/coducktor-tui/src/screens ] && rg -n 'reqwest|tokio_tungstenite|url::|StatusCode|HTTP status' crates/coducktor-tui/src/screens; then
            echo "TUI screens must depend on Engine, not transport details"
            exit 1
          fi

      # `lts/*` — the current Node LTS, whatever it is on the day the job runs, so
      # the gate follows the release line users actually install on instead of
      # freezing on a version that quietly ages out of support. The floor stays the
      # root manifest's `engines.node`; this is the ceiling we verify against.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run server and cockpit unit suites
        run: npm test

      - name: Build application
        run: npm run build
