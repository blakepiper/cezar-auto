name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The shipped binary has no Node dependency. Integration tests use checked-in `.mjs`
      # provider mocks, so CI declares their development-only runtime explicitly.
      - name: Set up Node for runner fixtures
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --all-targets
        env:
          # Snapshot baselines exercise the true-color palette; make that capability explicit
          # instead of inheriting whichever terminal environment the runner happens to expose.
          COLORTERM: truecolor

      - name: Enforce cockpit responsiveness and lock discipline
        run: |
          cargo test -p coducktor-client --test manager_lock_discipline
          cargo test -p coducktor-tui --lib live_thread_frame_at_twelve_thousand_events_stays_under_eight_ms
          cargo test -p coducktor-tui --bench thread_frame
        env:
          COLORTERM: truecolor

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check TUI screen transport boundary
        run: |
          if [ -d crates/coducktor-tui/src/screens ] && rg -n 'reqwest|tokio_tungstenite|url::|StatusCode|HTTP status' crates/coducktor-tui/src/screens; then
            echo "TUI screens must depend on Engine, not transport details"
            exit 1
          fi
